<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ع الجاهز - واجهة الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', 
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#f97316',
                        brandBlue: '#1e3a8a',
                        brandPurple: '#9333ea',
                        darkBg: '#0B0F19',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .neon-text { text-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
        .active-story {
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.3);
            border-color: #9333ea;
        }
        .direction-ltr { direction: ltr; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-24 overflow-x-hidden bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-white transition-colors duration-300">

    <!-- شريط تحديد الموقع -->
    <div class="bg-orange-50 dark:bg-brandOrange/10 border-b border-orange-100 dark:border-brandOrange/20 px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2 text-brandOrange text-xs font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span id="location-text">جاري تحديد موقعك...</span>
        </div>
        <span class="text-[10px] bg-brandOrange text-white px-2 py-0.5 rounded-full font-bold shadow-sm">GPS</span>
    </div>

    <!-- الهيدر والسلة -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-darkBg/90 backdrop-blur-md border-b border-gray-200 dark:border-white/10 shadow-sm transition-colors">
        <div class="flex justify-between items-center px-4 py-3">
            <button onclick="openCheckout()" class="relative bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 px-4 py-2 rounded-xl text-brandOrange font-bold flex items-center gap-2 hover:bg-gray-200 dark:hover:bg-white/10 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="text-xs">السلة</span>
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-brandPurple text-white text-xs font-bold rounded-full h-6 w-6 flex items-center justify-center shadow-md hidden">0</span>
            </button>
            <div class="text-2xl font-extrabold text-brandBlue dark:text-white tracking-wide">ع الـ<span class="text-brandOrange">جاهز</span></div>
        </div>
    </header>

    <!-- المطاعم -->
    <div class="pt-5 pb-2">
        <div class="flex gap-4 overflow-x-auto px-4 hide-scrollbar" id="restaurants-container"></div>
    </div>

    <!-- شريط البحث -->
    <div class="px-4 mt-3">
        <input type="text" id="search-input" oninput="filterAndDisplayMenu()" placeholder="🔍 ابحث عن أكلة (مثلاً: زنجر، كشري، برجر)..." class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-brandOrange transition-colors">
    </div>

    <!-- شريط الأقسام -->
    <div class="px-4 mt-3 mb-4">
        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2" id="categories-container"></div>
    </div>

    <!-- المنيو -->
    <main class="px-4 space-y-4" id="menu-container"></main>

    <!-- شاشة تفاصيل الأكلة -->
    <div id="item-options-overlay" class="fixed inset-0 bg-gray-900/60 dark:bg-black/80 backdrop-blur-sm z-[60] hidden flex-col justify-end">
        <div class="bg-white dark:bg-gray-900 rounded-t-3xl p-6 w-full max-w-md mx-auto relative border-t border-brandPurple/30 flex flex-col max-h-[90vh] overflow-y-auto transition-colors">
            <button onclick="closeItemOptions()" class="absolute top-4 left-4 bg-gray-100 dark:bg-white/10 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition-colors">✕</button>
            
            <h3 id="modal-item-name" class="text-xl font-extrabold text-brandBlue dark:text-white mb-1">اسم الأكلة</h3>
            <p class="text-brandOrange font-bold mb-6"><span id="modal-base-price">0</span> ج.م</p>

            <div id="spicy-section" class="mb-6 hidden">
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">عادي ولا سبايسي؟ 🌶️</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="border border-brandOrange bg-orange-50 dark:bg-brandOrange/10 text-brandOrange p-3 rounded-xl text-center font-bold cursor-pointer flex items-center justify-center gap-2 transition-colors">
                        <input type="radio" name="spicy_option" value="عادي" checked class="accent-brandOrange"> عادي (بارد)
                    </label>
                    <label class="border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 text-gray-600 dark:text-gray-400 p-3 rounded-xl text-center font-bold cursor-pointer hover:border-red-500 hover:text-red-500 flex items-center justify-center gap-2 transition-colors">
                        <input type="radio" name="spicy_option" value="سبايسي" class="accent-red-500"> سبايسي 🌶️
                    </label>
                </div>
            </div>

            <div id="addons-section" class="mb-8 hidden">
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">ظبط أكلك (إضافات) ✨</label>
                <div id="addons-container" class="space-y-3"></div>
            </div>

            <button onclick="confirmItemAdd()" class="w-full bg-gradient-to-r from-brandBlue to-brandPurple text-white font-extrabold text-lg py-4 rounded-xl shadow-lg hover:opacity-90 mt-auto flex justify-between px-6 transition-all">
                <span>إضافة للسلة</span>
                <span><span id="modal-total-price">0</span> ج.م</span>
            </button>
        </div>
    </div>

    <!-- شاشة السلة والدفع -->
    <div id="checkout-overlay" class="fixed inset-0 bg-gray-900/60 dark:bg-black/80 backdrop-blur-sm z-[70] hidden flex-col justify-end">
        <div class="bg-white dark:bg-gray-900 rounded-t-3xl p-6 max-h-[88vh] w-full max-w-md mx-auto relative border-t border-brandOrange/30 transition-colors flex flex-col overflow-y-auto">
            <button onclick="closeCheckout()" class="absolute top-4 left-4 bg-gray-100 dark:bg-white/10 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition-colors">✕</button>
            <h3 class="text-xl font-extrabold text-brandBlue dark:text-white mb-4 text-center">إتمام الطلب</h3>
            
            <!-- تفاصيل السلة -->
            <div id="cart-items-list" class="space-y-2 mb-4 max-h-40 overflow-y-auto"></div>

            <div class="bg-gray-50 dark:bg-white/5 p-4 rounded-2xl mb-4 text-center border border-gray-200 dark:border-white/10">
                <p class="text-xs font-bold text-gray-500 dark:text-gray-400">إجمالي الحساب</p>
                <p class="text-3xl font-extrabold text-brandOrange mt-1 dark:neon-text"><span id="checkout-total">0</span> <span class="text-base">ج.م</span></p>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">⏰ هتستلم إمتى؟</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="flex items-center justify-center gap-1 border border-brandOrange bg-orange-50 dark:bg-brandOrange/10 p-2.5 rounded-lg cursor-pointer transition-all">
                        <input type="radio" name="order_time" value="30" checked class="accent-brandOrange w-4 h-4">
                        <span class="text-xs font-bold text-gray-800 dark:text-white">30 دقيقة</span>
                    </label>
                    <label class="flex items-center justify-center gap-1 border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 p-2.5 rounded-lg cursor-pointer hover:border-brandOrange transition-all">
                        <input type="radio" name="order_time" value="60" class="accent-brandOrange w-4 h-4">
                        <span class="text-xs font-bold text-gray-800 dark:text-white">60 دقيقة</span>
                    </label>
                    <label class="flex items-center justify-center gap-1 border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 p-2.5 rounded-lg cursor-pointer hover:border-brandOrange transition-all">
                        <input type="radio" name="order_time" value="90" class="accent-brandOrange w-4 h-4">
                        <span class="text-xs font-bold text-gray-800 dark:text-white">90 دقيقة</span>
                    </label>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">💳 طريقة الدفع</label>
                <label class="flex items-center gap-3 p-3 border border-brandPurple bg-purple-50 dark:bg-brandPurple/10 rounded-xl cursor-pointer">
                    <input type="radio" name="payment" value="cash" checked class="w-4 h-4 accent-brandPurple">
                    <span class="font-bold text-gray-800 dark:text-white text-sm">كاش عند الاستلام 💵</span>
                </label>
            </div>

            <button id="submit-order-btn" onclick="submitOrderToDatabase()" class="w-full mt-auto bg-brandOrange text-white font-extrabold text-lg py-4 rounded-xl shadow-lg transition-all hover:bg-orange-600">
                تأكيد وإرسال الطلب للمطعم 🚀
            </button>
        </div>
    </div>

    <!-- شاشة التتبع والعداد -->
    <div id="tracking-overlay" class="fixed inset-0 bg-gray-900/95 dark:bg-black/95 backdrop-blur-sm z-[80] hidden flex-col justify-center items-center px-6 transition-colors">
        <div class="text-center mb-6">
            <span id="track-order-id" class="text-xs bg-brandPurple/20 text-purple-300 border border-purple-500/30 px-3 py-1 rounded-full font-bold">طلب #0</span>
            <h2 id="track-status-title" class="text-white text-2xl font-bold mt-3 mb-1">طلبك اتبعت للمطعم 👨‍🍳</h2>
            <p class="text-gray-400 text-sm">استلم أكلك بدون زحمة بعد:</p>
        </div>

        <div class="relative w-64 h-64 flex items-center justify-center mb-8">
            <div class="absolute inset-0 border-4 border-gray-700 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-transparent border-t-brandOrange border-r-brandPurple rounded-full animate-spin" style="animation-duration: 2s; box-shadow: 0 0 20px rgba(249,115,22,0.3);"></div>
            <div class="text-center">
                <span id="main-timer" class="text-5xl font-extrabold text-white tracking-widest block direction-ltr" style="text-shadow: 0 0 15px #f97316;">00:00</span>
                <span class="text-gray-400 text-sm font-bold mt-2">دقيقة : ثانية</span>
            </div>
        </div>

        <button id="cancel-btn" onclick="cancelOrder()" class="bg-gray-800 border border-red-500/50 text-red-400 px-6 py-3 rounded-xl font-bold flex flex-col items-center hover:bg-red-900/30 transition-all">
            <span>إلغاء الطلب ❌</span>
            <span class="text-xs mt-1 text-gray-400">متاح الإلغاء لمدة: <span id="cancel-timer" class="direction-ltr text-white font-bold">00:00</span></span>
        </button>

        <button onclick="hideTracking()" class="mt-8 text-gray-500 font-bold text-sm hover:text-white transition-colors">العودة للرئيسية</button>
    </div>

    <script>
        const supabaseUrl = 'https://tbebxktkqluhwdtuzmny.supabase.co';
        const supabaseKey = 'sb_publishable_BB-2fI8-0OvAo1O1ISPVjw_2o1AuxAJ';
        const supabaseApp = window.supabase.createClient(supabaseUrl, supabaseKey);

        const restaurants = [
            { id: 1, name: 'أفندينا', emoji: '🥘' },
            { id: 2, name: 'كريب اند وافل', emoji: '🧇' },
            { id: 3, name: 'سبايسي كريب', emoji: '🌮' },
            { id: 4, name: 'الطباخ', emoji: '🍗' }
        ];

        let currentActiveRestaurant = 1;
        let currentRestaurantItems = [];
        let currentCategory = 'الكل';
        let currentItem = null;
        let cartItems = []; 
        let cartTotal = 0;
        let activeOrderId = null;
        let orderInterval, cancelInterval, statusPollInterval;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { 
                const locText = document.getElementById('location-text');
                if(locText) locText.innerText = '📍 المعهد العالي بالقطامية'; 
            }, 1500);
            
            renderRestaurants();
            selectRestaurant(1); 
        });

        function renderRestaurants() {
            const container = document.getElementById('restaurants-container');
            container.innerHTML = restaurants.map(rest => {
                const isActive = rest.id === currentActiveRestaurant;
                const activeClasses = isActive ? 'from-brandOrange to-brandPurple active-story' : 'bg-gray-200 dark:bg-white/10 border-transparent';
                const opacity = isActive ? 'opacity-100' : 'opacity-60 hover:opacity-100';
                const textActive = isActive ? 'text-gray-900 dark:text-white' : 'text-gray-500 dark:text-gray-400';

                return `
                    <div onclick="selectRestaurant(${rest.id})" class="flex flex-col items-center gap-2 min-w-[75px] cursor-pointer ${opacity} transition-all">
                        <div class="w-16 h-16 rounded-full p-[3px] bg-gradient-to-tr ${activeClasses}">
                            <div class="w-full h-full rounded-full bg-white dark:bg-gray-900 flex items-center justify-center text-2xl border-2 border-white dark:border-gray-900">${rest.emoji}</div>
                        </div>
                        <span class="text-xs font-bold ${textActive} text-center">${rest.name}</span>
                    </div>
                `;
            }).join('');
        }

        function selectRestaurant(id) {
            if (id !== currentActiveRestaurant && cartItems.length > 0) {
                if (!confirm('تغيير المطعم هيمسح السلة الحالية، متأكد؟')) return;
                cartItems = [];
                updateCartUI();
            }
            currentActiveRestaurant = id;
            currentCategory = 'الكل';
            document.getElementById('search-input').value = '';
            renderRestaurants();
            loadRestaurantMenu(id);
        }

        function getSmartImage(category) {
            if (!category) return 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80';
            if (category.includes('برجر')) return 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80';
            if (category.includes('كريب')) return 'https://images.unsplash.com/photo-1511690078903-71dc5a49f5e3?w=500&q=80';
            if (category.includes('بيتزا')) return 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80';
            if (category.includes('شاورما') || category.includes('سوري')) return 'https://images.unsplash.com/photo-1648823153744-88db09d3119c?w=500&q=80';
            if (category.includes('كشري')) return 'https://images.unsplash.com/photo-1534080564583-6be75777b70a?w=500&q=80';
            if (category.includes('مكرون') || category.includes('باستا')) return 'https://images.unsplash.com/photo-1621996311221-33ca780f2d96?w=500&q=80';
            if (category.includes('وافل') || category.includes('حلو')) return 'https://images.unsplash.com/photo-1562376552-0d160a2f238d?w=500&q=80';
            if (category.includes('طاجن') || category.includes('الطواجن')) return 'https://images.unsplash.com/photo-1574484284002-952d92456975?w=500&q=80';
            return 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80';
        }

        async function loadRestaurantMenu(restaurantId) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '<div class="text-center mt-10 text-brandOrange font-bold animate-pulse">جاري تحميل المنيو... ⏳</div>';

            try {
                const { data: items, error } = await supabaseApp
                    .from('menu_items')
                    .select('*')
                    .eq('restaurant_id', restaurantId)
                    .eq('is_available', true);

                if (error) throw error;
                currentRestaurantItems = items || [];

                // استخراج الأقسام أوتوماتيك من الداتابيز
                const uniqueCats = ['الكل', ...new Set(currentRestaurantItems.map(i => i.category).filter(Boolean))];
                renderCategories(uniqueCats);
                filterAndDisplayMenu();
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-center text-red-500 mt-10 font-bold">حدث خطأ في الاتصال بالإنترنت.</p>';
            }
        }

        function renderCategories(cats) {
            const container = document.getElementById('categories-container');
            container.innerHTML = cats.map(cat => {
                const isActive = cat === currentCategory;
                const btnClass = isActive ? 'bg-brandOrange text-white border-brandOrange' : 'bg-white dark:bg-white/5 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-white/10 hover:border-brandOrange/50';
                return `<button onclick="selectCategory('${cat}')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold border transition-colors ${btnClass}">${cat}</button>`;
            }).join('');
        }

        function selectCategory(catName) {
            currentCategory = catName;
            const uniqueCats = ['الكل', ...new Set(currentRestaurantItems.map(i => i.category).filter(Boolean))];
            renderCategories(uniqueCats);
            filterAndDisplayMenu();
        }

        function filterAndDisplayMenu() {
            const container = document.getElementById('menu-container');
            const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();

            let filtered = currentRestaurantItems;
            if (currentCategory !== 'الكل') {
                filtered = filtered.filter(i => i.category === currentCategory);
            }
            if (searchQuery) {
                filtered = filtered.filter(i => 
                    (i.name && i.name.toLowerCase().includes(searchQuery)) ||
                    (i.description && i.description.toLowerCase().includes(searchQuery))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 mt-10 font-bold">لا توجد أصناف مطابقة حالياً 👨‍🍳</p>';
                return;
            }

            container.innerHTML = filtered.map(item => {
                const imgUrl = item.image_url ? item.image_url : getSmartImage(item.category);
                const itemData = encodeURIComponent(JSON.stringify(item));
                return `
                    <div class="bg-white dark:bg-white/5 border border-gray-100 dark:border-white/10 rounded-3xl p-3 flex gap-4 items-center shadow-sm hover:border-brandPurple/50 transition-all">
                        <img src="${imgUrl}" class="w-24 h-24 rounded-2xl object-cover shadow-sm flex-shrink-0">
                        <div class="flex-1 py-1">
                            <h3 class="font-extrabold text-brandBlue dark:text-white text-base">${item.name}</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">${item.description || ''}</p>
                            <div class="flex justify-between items-center mt-3">
                                <p class="text-brandOrange font-extrabold text-lg">${item.price} <span class="text-xs">ج.م</span></p>
                                <button onclick="openItemOptionsDynamic('${itemData}')" class="bg-gray-100 dark:bg-white/10 text-brandBlue dark:text-white px-4 py-1.5 rounded-lg font-bold text-sm hover:bg-brandPurple hover:text-white transition-all">+ أضف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openItemOptionsDynamic(encodedItem) {
            currentItem = JSON.parse(decodeURIComponent(encodedItem));
            document.getElementById('modal-item-name').innerText = currentItem.name;
            document.getElementById('modal-base-price').innerText = currentItem.price;
            document.getElementById('modal-total-price').innerText = currentItem.price;

            const spicySection = document.getElementById('spicy-section');
            spicySection.classList.toggle('hidden', !currentItem.has_spicy);

            const addonsContainer = document.getElementById('addons-container');
            const addonsSection = document.getElementById('addons-section');
            addonsContainer.innerHTML = '';

            if (Array.isArray(currentItem.addons) && currentItem.addons.length > 0) {
                addonsSection.classList.remove('hidden');
                currentItem.addons.forEach(addon => {
                    addonsContainer.innerHTML += `
                        <label class="flex items-center justify-between p-3 border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 rounded-xl cursor-pointer hover:border-brandPurple">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" data-name="${addon.name}" value="${addon.price}" onchange="calculateModalTotal()" class="extra-addon w-5 h-5 accent-brandPurple rounded">
                                <span class="font-bold text-gray-800 dark:text-white">${addon.name}</span>
                            </div>
                            <span class="text-sm font-bold text-brandPurple">+${addon.price} ج.م</span>
                        </label>
                    `;
                });
            } else {
                addonsSection.classList.add('hidden');
            }

            document.getElementById('item-options-overlay').classList.remove('hidden');
            document.getElementById('item-options-overlay').classList.add('flex');
        }

        function closeItemOptions() {
            document.getElementById('item-options-overlay').classList.add('hidden');
            document.getElementById('item-options-overlay').classList.remove('flex');
        }

        function calculateModalTotal() {
            let total = Number(currentItem.price);
            document.querySelectorAll('.extra-addon:checked').forEach(cb => { total += Number(cb.value); });
            document.getElementById('modal-total-price').innerText = total;
        }

        function confirmItemAdd() {
            let itemPrice = Number(currentItem.price);
            let spicyLevel = 'عادي';
            let selectedAddons = [];

            if (currentItem.has_spicy) {
                const spicyEl = document.querySelector('input[name="spicy_option"]:checked');
                if (spicyEl) spicyLevel = spicyEl.value;
            }

            document.querySelectorAll('.extra-addon:checked').forEach(cb => { 
                itemPrice += Number(cb.value); 
                selectedAddons.push(cb.getAttribute('data-name'));
            });

            let finalName = currentItem.name;
            if (currentItem.has_spicy) finalName += ` (${spicyLevel})`;
            if (selectedAddons.length > 0) finalName += ` + ${selectedAddons.join(' + ')}`;

            cartItems.push({ name: finalName, price: itemPrice, quantity: 1 });
            updateCartUI();
            closeItemOptions();
        }

        function removeFromCart(index) {
            cartItems.splice(index, 1);
            updateCartUI();
            if (cartItems.length === 0) closeCheckout();
        }

        function updateCartUI() {
            cartTotal = cartItems.reduce((sum, item) => sum + item.price, 0);
            const badge = document.getElementById('cart-badge');
            badge.innerText = cartItems.length;
            badge.classList.toggle('hidden', cartItems.length === 0);
            document.getElementById('checkout-total').innerText = cartTotal;

            const listEl = document.getElementById('cart-items-list');
            listEl.innerHTML = cartItems.map((item, idx) => `
                <div class="flex justify-between items-center bg-gray-50 dark:bg-white/5 p-2.5 rounded-xl border border-gray-100 dark:border-white/10 text-sm">
                    <span class="font-bold truncate flex-1">${item.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="text-brandOrange font-bold">${item.price} ج.م</span>
                        <button onclick="removeFromCart(${idx})" class="text-red-500 text-xs font-bold">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function openCheckout() {
            if (cartItems.length === 0) return alert("السلة فاضية يا هندسة!");
            updateCartUI();
            document.getElementById('checkout-overlay').classList.remove('hidden');
            document.getElementById('checkout-overlay').classList.add('flex');
        }

        function closeCheckout() {
            document.getElementById('checkout-overlay').classList.add('hidden');
            document.getElementById('checkout-overlay').classList.remove('flex');
        }

        async function submitOrderToDatabase() {
            const btn = document.getElementById('submit-order-btn');
            const selectedMinutes = Number(document.querySelector('input[name="order_time"]:checked').value) || 30;
            btn.innerText = 'جاري إرسال الطلب... ⏳';
            btn.disabled = true;

            try {
                const { data: { user } } = await supabaseApp.auth.getUser();
                const studentName = user?.user_metadata?.full_name || 'طالب';
                const studentPhone = user?.user_metadata?.phone || 'غير مسجل';

                const { data, error } = await supabaseApp
                    .from('orders')
                    .insert([{
                        restaurant_id: currentActiveRestaurant,
                        user_id: user ? user.id : null,
                        total_price: cartTotal,
                        status: 'new',
                        items: cartItems,
                        pickup_minutes: selectedMinutes,
                        customer_name: studentName,
                        customer_phone: studentPhone
                    }])
                    .select()
                    .single();

                if (error) throw error;

                activeOrderId = data.id;
                document.getElementById('track-order-id').innerText = `طلب #${activeOrderId}`;
                document.getElementById('track-status-title').innerText = 'طلبك اتبعت للمطعم 👨‍🍳';

                closeCheckout();
                document.getElementById('tracking-overlay').classList.remove('hidden');
                document.getElementById('tracking-overlay').classList.add('flex');
                
                cartItems = [];
                updateCartUI();
                startTimers(selectedMinutes);
                startStatusPolling(activeOrderId);

            } catch (error) {
                console.error("خطأ في إرسال الطلب:", error);
                alert("حدث خطأ أثناء إرسال الطلب. تأكد من الإنترنت.");
            } finally {
                btn.innerText = 'تأكيد وإرسال الطلب للمطعم 🚀';
                btn.disabled = false;
            }
        }

        function startTimers(minutes) {
            clearInterval(orderInterval);
            clearInterval(cancelInterval);
            
            let totalOrderTime = minutes * 60;
            // مهلة الإلغاء = 10% من وقت الاستلام المختار
            let cancelWindow = Math.floor(totalOrderTime * 0.10); 
            
            const mainTimerDisplay = document.getElementById('main-timer');
            const cancelBtn = document.getElementById('cancel-btn');
            const cancelTimerDisplay = document.getElementById('cancel-timer');
            
            cancelBtn.classList.remove('hidden');

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            };

            mainTimerDisplay.innerText = formatTime(totalOrderTime);
            cancelTimerDisplay.innerText = formatTime(cancelWindow);

            orderInterval = setInterval(() => {
                if (totalOrderTime <= 0) {
                    clearInterval(orderInterval);
                    mainTimerDisplay.innerText = "00:00";
                    document.getElementById('track-status-title').innerText = 'وقتك جه! استلم أكلك دلوقتي 🎉';
                    return;
                }
                totalOrderTime--;
                mainTimerDisplay.innerText = formatTime(totalOrderTime);
            }, 1000);

            cancelInterval = setInterval(() => {
                if (cancelWindow <= 0) {
                    clearInterval(cancelInterval);
                    cancelBtn.classList.add('hidden'); 
                    return;
                }
                cancelWindow--;
                cancelTimerDisplay.innerText = formatTime(cancelWindow);
            }, 1000);
        }

        function startStatusPolling(orderId) {
            clearInterval(statusPollInterval);
            statusPollInterval = setInterval(async () => {
                const { data } = await supabaseApp.from('orders').select('status').eq('id', orderId).single();
                if (!data) return;

                const title = document.getElementById('track-status-title');
                const cancelBtn = document.getElementById('cancel-btn');

                if (data.status === 'prep') {
                    title.innerText = 'المطعم بيجهز أكلك دلوقتي 🔥';
                    cancelBtn.classList.add('hidden'); // لو بدأ التجهيز مفيش إلغاء
                } else if (data.status === 'ready') {
                    title.innerText = 'أكلك جاهز للاستلام فوراً ✅';
                    cancelBtn.classList.add('hidden');
                } else if (data.status === 'done' || data.status === 'completed') {
                    title.innerText = 'تم التسليم بالهنا والشفا 🎉';
                    cancelBtn.classList.add('hidden');
                    clearInterval(statusPollInterval);
                    clearInterval(orderInterval);
                }
            }, 10000);
        }

        async function cancelOrder() {
            if (!confirm("متأكد إنك عايز تلغي الطلب؟")) return;
            if (activeOrderId) {
                await supabaseApp.from('orders').update({ status: 'cancelled' }).eq('id', activeOrderId);
            }
            clearInterval(orderInterval);
            clearInterval(cancelInterval);
            clearInterval(statusPollInterval);
            hideTracking();
            alert("تم إلغاء الطلب بنجاح.");
        }

        function hideTracking() {
            document.getElementById('tracking-overlay').classList.add('hidden');
            document.getElementById('tracking-overlay').classList.remove('flex');
        }
    </script>
</body>
</html>
