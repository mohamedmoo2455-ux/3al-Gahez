<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ع الجاهز - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brandOrange: '#f97316',
                        brandBlue: '#1e3a8a',
                        brandPurple: '#9333ea',
                        darkBg: '#0B0F19',
                        darkInput: 'rgba(255, 255, 255, 0.05)',
                    },
                    backgroundImage: {
                        'food-pattern': "url('https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=1200&auto=format&fit=crop')",
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .input-ltr { direction: ltr; text-align: left; }
    </style>
</head>

<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-white min-h-screen flex flex-col transition-colors duration-300">

    <div class="h-72 w-full bg-food-pattern bg-cover bg-center relative">
        <div class="absolute inset-0 bg-gradient-to-b from-darkBg/40 via-darkBg/60 to-gray-50 dark:to-darkBg"></div>

        <div class="absolute top-6 right-6 flex items-center gap-2 z-10">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brandOrange to-brandPurple flex items-center justify-center shadow-lg border border-white/20">
                <span class="text-xl font-bold text-white">ع</span>
            </div>
            <span class="text-2xl font-extrabold text-white drop-shadow-md">
                الـ<span class="text-brandOrange">جاهز</span>
            </span>
        </div>
    </div>

    <div class="flex-1 px-6 pb-8 flex flex-col justify-center -mt-16 relative z-20 max-w-md mx-auto w-full">

        <div class="flex bg-white dark:bg-gray-800/80 backdrop-blur-md rounded-xl p-1 mb-8 border border-gray-200 dark:border-gray-700 shadow-sm">
            <button
                type="button"
                onclick="toggleView('login')"
                id="btnLoginTab"
                class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-gray-100 dark:bg-gray-700 text-brandOrange shadow-sm transition-all">
                تسجيل الدخول
            </button>

            <button
                type="button"
                onclick="toggleView('register')"
                id="btnRegisterTab"
                class="flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all">
                إنشاء حساب
            </button>
        </div>

        <h1 id="formTitle" class="text-3xl font-bold mb-2">مرحباً بك مجدداً</h1>

        <p id="formSubtitle" class="text-gray-500 dark:text-gray-400 text-sm mb-8">
            سجل الدخول للمتابعة إلى حسابك.
        </p>

        <!-- تسجيل الدخول -->
        <form id="loginForm" class="space-y-5">

            <div class="relative">
                <input
                    type="email"
                    id="loginEmail"
                    required
                    autocomplete="email"
                    placeholder="البريد الإلكتروني"
                    class="input-ltr w-full px-5 py-4 rounded-2xl bg-white dark:bg-darkInput border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white focus:outline-none focus:border-brandPurple focus:ring-1 focus:ring-brandPurple transition-all shadow-sm">
            </div>

            <div class="relative">
                <input
                    type="password"
                    id="loginPass"
                    required
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                    class="input-ltr w-full px-5 py-4 rounded-2xl bg-white dark:bg-darkInput border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white focus:outline-none focus:border-brandPurple focus:ring-1 focus:ring-brandPurple transition-all shadow-sm">

                <button
                    type="button"
                    onclick="togglePassword('loginPass', 'eyeIconLogin')"
                    class="absolute inset-y-0 left-0 pl-5 flex items-center">

                    <svg
                        id="eyeIconLogin"
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>

            <div class="flex justify-end">
                <button
                    type="button"
                    onclick="openForgotPasswordModal()"
                    class="text-xs font-bold text-brandOrange hover:underline transition-colors">
                    نسيت كلمة المرور؟
                </button>
            </div>

            <div
                id="errorMessage"
                class="hidden text-red-500 text-sm font-bold text-center mt-2 bg-red-50 dark:bg-red-900/20 p-2 rounded-lg border border-red-200 dark:border-red-800/50">
                بيانات الدخول غير صحيحة!
            </div>

            <button
                type="submit"
                class="w-full mt-4 bg-gradient-to-r from-brandBlue to-brandPurple text-white font-bold py-4 rounded-full flex justify-between items-center px-6 hover:opacity-90 transition-opacity shadow-[0_4px_14px_0_rgba(147,51,234,0.39)]">

                <span></span>
                <span class="text-lg">دخول</span>

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 rtl:rotate-180"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <!-- إنشاء حساب طالب -->
        <form id="registerForm" class="space-y-5 hidden">

            <div class="relative">
                <input
                    type="text"
                    id="regName"
                    required
                    autocomplete="name"
                    placeholder="الاسم بالكامل"
                    class="w-full px-5 py-4 rounded-2xl bg-white dark:bg-darkInput border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white focus:outline-none focus:border-brandOrange focus:ring-1 focus:ring-brandOrange transition-all shadow-sm">
            </div>

            <div class="relative">
                <input
                    type="email"
                    id="regEmail"
                    required
                    autocomplete="email"
                    placeholder="البريد الإلكتروني"
                    class="input-ltr w-full px-5 py-4 rounded-2xl bg-white dark:bg-darkInput border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white focus:outline-none focus:border-brandPurple focus:ring-1 focus:ring-brandPurple transition-all shadow-sm">
            </div>

            <div class="relative">
                <input
                    type="tel"
                    id="regPhone"
                    required
                    autocomplete="tel"
                    placeholder="رقم التليفون"
                    class="input-ltr w-full px-5 py-4 rounded-2xl bg-white dark:bg-darkInput border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white focus:outline-none focus:border-brandPurple focus:ring-1 focus:ring-brandPurple transition-all shadow-sm">
            </div>

            <div class="relative">
                <input
                    type="password"
                    id="regPass"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="كلمة المرور"
                    class="input-ltr w-full px-5 py-4 rounded-2xl bg-white dark:bg-darkInput border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white focus:outline-none focus:border-brandOrange focus:ring-1 focus:ring-brandOrange transition-all shadow-sm">

                <button
                    type="button"
                    onclick="togglePassword('regPass', 'eyeIconReg')"
                    class="absolute inset-y-0 left-0 pl-5 flex items-center">

                    <svg
                        id="eyeIconReg"
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>

            <div
                id="registerMessage"
                class="hidden text-sm font-bold text-center mt-2 p-3 rounded-lg">
            </div>

            <button
                type="submit"
                class="w-full mt-4 bg-gradient-to-r from-brandOrange to-red-500 text-white font-bold py-4 rounded-full flex justify-between items-center px-6 hover:opacity-90 transition-opacity shadow-[0_4px_14px_0_rgba(249,115,22,0.39)]">

                <span></span>
                <span class="text-lg">إنشاء حساب</span>

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 rtl:rotate-180"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>
    </div>

    <!-- نافذة إرسال رابط استعادة كلمة المرور -->
    <div id="forgotPasswordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-900 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-xl border border-gray-200 dark:border-white/10">
            <h3 class="text-lg font-extrabold text-brandBlue dark:text-white">استعادة كلمة المرور</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">
                أدخل بريدك الإلكتروني المسجل وسنرسل لك رابطاً لتعيين كلمة مرور جديدة.
            </p>
            <input
                type="email"
                id="forgotEmailInput"
                placeholder="البريد الإلكتروني"
                class="input-ltr w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkInput border border-gray-200 dark:border-white/10 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brandOrange">
            <div id="forgotMessage" class="hidden text-xs font-bold text-center p-2.5 rounded-lg"></div>
            <div class="flex gap-2 pt-1">
                <button
                    type="button"
                    id="sendResetBtn"
                    onclick="sendPasswordResetEmail()"
                    class="flex-1 bg-brandOrange text-white py-2.5 rounded-xl font-bold text-sm hover:bg-orange-600 transition-colors">
                    إرسال الرابط
                </button>
                <button
                    type="button"
                    onclick="closeForgotPasswordModal()"
                    class="flex-1 bg-gray-200 dark:bg-gray-800 py-2.5 rounded-xl font-bold text-sm hover:opacity-80 transition-opacity">
                    إلغاء
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة تعيين كلمة مرور جديدة بعد فتح الرابط من البريد -->
    <div id="resetPasswordModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-900 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-xl border border-brandPurple/40">
            <h3 class="text-lg font-extrabold text-brandBlue dark:text-white">تعيين كلمة مرور جديدة</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">
                أدخل كلمة المرور الجديدة لحسابك (6 أحرف على الأقل).
            </p>
            <input
                type="password"
                id="newPasswordInput"
                minlength="6"
                placeholder="كلمة المرور الجديدة"
                class="input-ltr w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkInput border border-gray-200 dark:border-white/10 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brandPurple">
            <input
                type="password"
                id="confirmPasswordInput"
                minlength="6"
                placeholder="تأكيد كلمة المرور الجديدة"
                class="input-ltr w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkInput border border-gray-200 dark:border-white/10 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brandPurple">
            <div id="resetConfirmMessage" class="hidden text-xs font-bold text-center p-2.5 rounded-lg"></div>
            <button
                type="button"
                id="confirmNewPasswordBtn"
                onclick="submitNewPassword()"
                class="w-full bg-gradient-to-r from-brandBlue to-brandPurple text-white py-3 rounded-xl font-bold text-sm hover:opacity-90 transition-opacity">
                حفظ كلمة المرور الجديدة
            </button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://tbebxktkqluhwdtuzmny.supabase.co';
        const supabaseKey = 'sb_publishable_BB-2fI8-0OvAo1O1ISPVjw_2o1AuxAJ';

        const supabaseApp = window.supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        let isRecoveryMode = false;

        function getRedirectUrl() {
            const base = window.location.origin + window.location.pathname;
            return base.startsWith('http') ? base : undefined;
        }

        function togglePassword(inputId, iconId) {
            const passInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);

            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />`;
            } else {
                passInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        function toggleView(view) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const btnLogin = document.getElementById('btnLoginTab');
            const btnRegister = document.getElementById('btnRegisterTab');
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');

            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('registerMessage').classList.add('hidden');

            if (view === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                title.innerText = 'مرحباً بك مجدداً';
                subtitle.innerText = 'سجل الدخول للمتابعة إلى حسابك.';
                btnLogin.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-gray-100 dark:bg-gray-700 text-brandOrange shadow-sm transition-all";
                btnRegister.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                title.innerText = 'حساب طالب جديد';
                subtitle.innerText = 'أدخل بياناتك لإنشاء حسابك في ع الجاهز.';
                btnRegister.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-gray-100 dark:bg-gray-700 text-brandOrange shadow-sm transition-all";
                btnLogin.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all";
            }
        }

        function openForgotPasswordModal() {
            const modal = document.getElementById('forgotPasswordModal');
            const msgBox = document.getElementById('forgotMessage');
            const loginEmailVal = document.getElementById('loginEmail').value.trim();

            msgBox.classList.add('hidden');
            if (loginEmailVal) {
                document.getElementById('forgotEmailInput').value = loginEmailVal;
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeForgotPasswordModal() {
            const modal = document.getElementById('forgotPasswordModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function sendPasswordResetEmail() {
            const emailInput = document.getElementById('forgotEmailInput');
            const msgBox = document.getElementById('forgotMessage');
            const sendBtn = document.getElementById('sendResetBtn');
            const email = emailInput.value.trim();

            if (!email) {
                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-red-500 bg-red-50 dark:bg-red-900/20';
                msgBox.textContent = 'من فضلك أدخل البريد الإلكتروني أولاً.';
                msgBox.classList.remove('hidden');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'جاري الإرسال... ⏳';
            msgBox.classList.add('hidden');

            try {
                const redirectUrl = getRedirectUrl();
                const options = redirectUrl ? { redirectTo: redirectUrl } : undefined;
                const { error } = await supabaseApp.auth.resetPasswordForEmail(email, options);
                if (error) throw error;

                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-green-600 bg-green-50 dark:bg-green-900/20';
                msgBox.textContent = 'تم إرسال رابط الاستعادة إلى بريدك الإلكتروني (تحقق من الوارد والرسائل غير المرغوب فيها).';
                msgBox.classList.remove('hidden');
            } catch (error) {
                console.error('Reset email error:', error);
                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-red-500 bg-red-50 dark:bg-red-900/20';
                msgBox.textContent = error.message || 'تعذر إرسال رابط الاستعادة.';
                msgBox.classList.remove('hidden');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'إرسال الرابط';
            }
        }

        function openResetPasswordModal() {
            isRecoveryMode = true;
            const modal = document.getElementById('resetPasswordModal');
            if (!modal) return;
            if (modal.classList.contains('flex')) return;

            const msgBox = document.getElementById('resetConfirmMessage');
            if (msgBox) msgBox.classList.add('hidden');
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('confirmPasswordInput').value = '';

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        async function submitNewPassword() {
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const msgBox = document.getElementById('resetConfirmMessage');
            const btn = document.getElementById('confirmNewPasswordBtn');

            if (!newPassword || newPassword.length < 6) {
                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-red-500 bg-red-50 dark:bg-red-900/20';
                msgBox.textContent = 'كلمة المرور يجب ألا تقل عن 6 أحرف.';
                msgBox.classList.remove('hidden');
                return;
            }

            if (newPassword !== confirmPassword) {
                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-red-500 bg-red-50 dark:bg-red-900/20';
                msgBox.textContent = 'كلمتا المرور غير متطابقتين.';
                msgBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'جاري الحفظ... ⏳';
            msgBox.classList.add('hidden');

            try {
                const { error } = await supabaseApp.auth.updateUser({ password: newPassword });
                if (error) throw error;

                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-green-600 bg-green-50 dark:bg-green-900/20';
                msgBox.textContent = 'تم تحديث كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول.';
                msgBox.classList.remove('hidden');

                isRecoveryMode = false;
                await supabaseApp.auth.signOut();
                if (window.history.replaceState) {
                    window.history.replaceState(null, '', window.location.pathname);
                }

                setTimeout(() => {
                    const modal = document.getElementById('resetPasswordModal');
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    toggleView('login');
                }, 1500);
            } catch (error) {
                console.error('Update password error:', error);
                msgBox.className = 'text-xs font-bold text-center p-2.5 rounded-lg text-red-500 bg-red-50 dark:bg-red-900/20';
                msgBox.textContent = error.message || 'تعذر تحديث كلمة المرور.';
                msgBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'حفظ كلمة المرور الجديدة';
            }
        }

        async function detectAndHandleRecovery() {
            const fullUrl = window.location.href || '';
            const hash = window.location.hash || '';
            const search = window.location.search || '';
            const params = new URLSearchParams(search);

            if (params.get('code') && typeof supabaseApp.auth.exchangeCodeForSession === 'function') {
                try {
                    await supabaseApp.auth.exchangeCodeForSession(params.get('code'));
                } catch (_) {}
            }

            if (
                fullUrl.includes('type=recovery') ||
                hash.includes('recovery') ||
                search.includes('recovery') ||
                params.get('type') === 'recovery'
            ) {
                openResetPasswordModal();
                return;
            }

            const { data } = await supabaseApp.auth.getSession();
            if (data && data.session && (hash.includes('access_token') || params.get('code'))) {
                openResetPasswordModal();
            }
        }

        supabaseApp.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') {
                openResetPasswordModal();
            }
        });

        detectAndHandleRecovery();
        window.addEventListener('DOMContentLoaded', () => {
            detectAndHandleRecovery();
            setTimeout(detectAndHandleRecovery, 350);
            setTimeout(detectAndHandleRecovery, 900);
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;

            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');
            const originalButtonHTML = submitBtn.innerHTML;

            errorMessage.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري تسجيل الدخول... ⏳';

            try {
                const { data: authData, error: authError } =
                    await supabaseApp.auth.signInWithPassword({
                        email,
                        password
                    });

                if (authError) throw authError;

                const userId = authData.user.id;

                const { data: profile, error: profileError } = await supabaseApp
                    .from('users_profiles')
                    .select('id, role, restaurant_id')
                    .eq('id', userId)
                    .single();

                if (profileError) throw profileError;

                if (profile.role === 'restaurant') {
                    if (!profile.restaurant_id) {
                        throw new Error('حساب المطعم غير مربوط بمطعم.');
                    }
                    window.location.replace('restaurant-dashboard.html');
                    return;
                }

                if (profile.role === 'admin') {
                    window.location.replace('admin-dashboard.html');
                    return;
                }

                if (profile.role === 'student') {
                    window.location.replace('student-app.html');
                    return;
                }

                throw new Error('نوع الحساب غير معروف.');

            } catch (error) {
                console.error('Login error:', error);
                await supabaseApp.auth.signOut();
                errorMessage.textContent =
                    'تعذر تسجيل الدخول أو التحقق من الحساب. راجع بياناتك أو تواصل مع الإدارة.';
                errorMessage.classList.remove('hidden');

            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalButtonHTML;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPass').value;

            const registerMessage = document.getElementById('registerMessage');
            const submitBtn = document.querySelector('#registerForm button[type="submit"]');
            const originalButtonHTML = submitBtn.innerHTML;

            registerMessage.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري إنشاء الحساب... ⏳';

            try {
                const redirectUrl = getRedirectUrl();
                const signUpOptions = {
                    data: {
                        full_name: name,
                        phone: phone
                    }
                };
                if (redirectUrl) {
                    signUpOptions.emailRedirectTo = redirectUrl;
                }

                const { data, error } = await supabaseApp.auth.signUp({
                    email,
                    password,
                    options: signUpOptions
                });

                if (error) throw error;

                if (data.user) {
                    await supabaseApp.from('users_profiles').upsert([{
                        id: data.user.id,
                        role: 'student',
                        full_name: name,
                        phone: phone
                    }], { onConflict: 'id' });
                }

                if (data.session) {
                    registerMessage.className =
                        'text-green-600 text-sm font-bold text-center mt-2 p-3 rounded-lg bg-green-50 dark:bg-green-900/20';
                    registerMessage.textContent =
                        'تم إنشاء حسابك بنجاح! جاري تحويلك...';
                    window.location.replace('student-app.html');

                } else {
                    registerMessage.className =
                        'text-green-600 text-sm font-bold text-center mt-2 p-3 rounded-lg bg-green-50 dark:bg-green-900/20';
                    registerMessage.textContent =
                        'تم إنشاء الحساب بنجاح. راجع بريدك الإلكتروني واضغط على رابط التأكيد، وبعدها يمكنك تسجيل الدخول.';
                }

            } catch (error) {
                console.error('Registration error:', error);

                let message = 'حصل خطأ أثناء إنشاء الحساب. حاول مرة أخرى.';
                if (
                    error.message &&
                    error.message.toLowerCase().includes('already registered')
                ) {
                    message = 'البريد الإلكتروني ده مسجل بالفعل. جرّب تسجيل الدخول.';
                } else if (error.message) {
                    message = error.message;
                }

                registerMessage.className =
                    'text-red-500 text-sm font-bold text-center mt-2 p-3 rounded-lg bg-red-50 dark:bg-red-900/20';
                registerMessage.textContent = message;
                registerMessage.classList.remove('hidden');

            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalButtonHTML;
            }
        });
    </script>
</body>
